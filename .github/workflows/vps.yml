name: VPS Session
on:
  workflow_dispatch:

jobs:
  vps-session:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Start Tailscale
        run: |
          sudo tailscaled & sleep 8
          sudo tailscale up --authkey ${{ secrets.VPS }} --hostname=gh-vps --ssh

      - name: Keep alive
        run: |
          echo "Сервер в сети Tailscale. Ищи gh-vps в приложении Tailscale."
          sleep 21000
